name: Terminal IME E2E

on:
  # Let pr.yml own costly real-IBus path routing; a separate pull_request trigger would run every PR.
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: read

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  linux-x11:
    name: Linux X11 terminal IME
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install native build and IME tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential
          dbus-x11
          dconf-gsettings-backend
          ibus
          ibus-hangul
          ibus-libpinyin
          ibus-mozc
          ibus-unikey
          libglib2.0-bin
          python3
          xdotool
          xfwm4
          xvfb

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron

      - name: Build Electron app for E2E
        run: pnpm exec electron-vite build --mode e2e

      - name: Scratch IME composer QA
        if: '!cancelled()'
        env:
          SKIP_BUILD: '1'
        run: node config/scripts/runtime-verification/terminal-e2e/run-scratch-ime-composer-qa.mjs

      - name: Upload terminal IME evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-ime-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
